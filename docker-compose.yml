# CAUDAL completo en local: PostgreSQL 18 + API + servicio de IA + PWA (y simulador opcional).
# Requiere los cuatro repositorios clonados como carpetas hermanas:
#   caudal-backend/  caudal-frontend/  caudal-ia/  caudal-simulador/
# Uso:  make up      (todo)        make up-core  (solo db + api)
#       docker compose up -d db    (solo PostgreSQL, como antes)
# Las credenciales salen de .env (make env lo genera desde .env.example). Guía: docs/Arranque-local.md
name: caudal

services:
  db:
    image: postgres:18
    container_name: caudal-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: caudal
      # Dueño del esquema: el mismo usuario que ejecuta las migraciones de Flyway.
      POSTGRES_USER: ${FLYWAY_USER:-caudal_migrator}
      POSTGRES_PASSWORD: ${FLYWAY_PASSWORD:?Define FLYWAY_PASSWORD en .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
      # Solo desarrollo: docker/db-init crea caudal_app con esta contraseña antes de V1.
      APP_DB_PASSWORD: ${DATABASE_PASSWORD:-}
    ports:
      # Solo en la máquina local, nunca expuesto a la red.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - caudal-db-data:/var/lib/postgresql
      # ":z" permite leer el montaje en hosts con SELinux (Fedora, RHEL); en los demás no tiene efecto.
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d caudal"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build: .
    image: caudal-api:local
    container_name: caudal-api
    profiles: [core, full]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro de la red de compose la base se llama "db". sslmode=disable solo contra el contenedor local.
      DATABASE_URL: jdbc:postgresql://db:5432/caudal?sslmode=disable
      FLYWAY_URL: jdbc:postgresql://db:5432/caudal?sslmode=disable
      # La IA escucha en 7860 dentro de su contenedor (PORT del Dockerfile de caudal-ia).
      IA_SERVICE_URL: http://ia:7860
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
      COOKIE_SAME_SITE: Lax
      COOKIE_SECURE: "false"
      API_PUBLIC_URL: http://localhost:8080
      PORT: "10000"
    ports:
      - "127.0.0.1:8080:10000"

  ia:
    build: ../caudal-ia
    image: caudal-ia:local
    container_name: caudal-ia
    profiles: [full]
    restart: unless-stopped
    environment:
      IA_SERVICE_TOKEN: ${IA_SERVICE_TOKEN:?Define IA_SERVICE_TOKEN en .env}
      PORT: "7860"
      LOG_LEVEL: INFO
      API_DOCS_ENABLED: "true"
      SERIES_TIMEZONE: America/Bogota
    ports:
      - "127.0.0.1:8000:7860"

  web:
    build:
      context: ../caudal-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    image: caudal-web:local
    container_name: caudal-web
    profiles: [full]
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

  sim:
    build: ../caudal-simulador
    image: caudal-sim:local
    container_name: caudal-sim
    profiles: [sim]
    depends_on:
      - api
    environment:
      # El simulador habla con la API por la red interna, como un cliente externo más.
      CAUDAL_SIM_API_BASE_URL: http://api:10000
    ports:
      - "127.0.0.1:8090:8000"

volumes:
  caudal-db-data:
